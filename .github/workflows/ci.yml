name: ci
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.8", "3.12"]
        exclude:
          - os: macos-latest
            python: "3.8"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: compile
        run: python -m compileall -q agenthub tests
      - name: tests (stdlib unittest, no dependencies)
        run: python -m unittest discover -s tests -v
      - name: installer syntax
        run: sh -n install.sh
      - name: dashboard syntax
        if: matrix.os == 'ubuntu-latest'
        run: node --check agenthub/hub/web/app.js
