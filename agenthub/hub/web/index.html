<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agent-hub</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='5' fill='%234f6bed'/%3E%3Ccircle cx='6' cy='8' r='3' fill='%234f6bed' opacity='.6'/%3E%3Ccircle cx='26' cy='8' r='3' fill='%234f6bed' opacity='.6'/%3E%3Ccircle cx='16' cy='28' r='3' fill='%234f6bed' opacity='.6'/%3E%3C/svg%3E">
<script>
  // apply the saved theme before first paint, so there is no flash
  try { var t = localStorage.getItem("hub-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="top">
  <a class="brand" href="#/"><span class="dot"></span>agent-hub</a>
  <nav id="nav">
    <a href="#/" data-v="home"><span data-i18n="nav.home">Inbox</span><span class="badge" id="att-count"></span></a>
    <a href="#/projects" data-v="projects" data-i18n="nav.projects">Projects</a>
    <a href="#/tasks" data-v="tasks" data-i18n="nav.tasks">Tasks</a>
    <a href="#/shared" data-v="shared" data-i18n="nav.shared">Shared</a>
    <a href="#/agents" data-v="agents" data-i18n="nav.agents">Agents</a>
    <a href="#/nodes" data-v="nodes" data-i18n="nav.nodes">Nodes</a>
    <a href="#/activity" data-v="activity" data-i18n="nav.activity">Activity</a>
    <a href="#/skills" data-v="skills" data-i18n="nav.skills">Skills</a>
    <a href="#/guide" data-v="guide" data-i18n="nav.guide">Guide</a>
  </nav>
  <div class="right">
    <input id="search" placeholder="Search tasks / activity" data-i18n-placeholder="top.search" autocomplete="off">
    <button id="lang" class="theme-btn lang-btn" title="切换到中文">中</button>
    <button id="theme" class="theme-btn" title="Toggle light / dark" data-i18n-title="theme.toggle"></button>
    <span id="conn" class="conn" title="Live connection" data-i18n-title="top.conn"></span>
  </div>
</header>
<main id="app"><div class="empty">loading…</div></main>
<div id="modal" class="modal hidden"><div class="modal-box" id="modal-box"></div></div>
<div id="toast" class="toast hidden"></div>
<script src="/static/app.js"></script>
</body>
</html>
